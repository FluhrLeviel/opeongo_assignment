[project]
name = "opengo"
version = "0.1.0"
description = "ECM gene program in ccRCC across single-cell, bulk RNA and protein cohorts (Opeongo assignment)"
requires-python = "==3.11.*"
dependencies = [
    "anndata==0.12.19",
    "click==8.5.1",
    "h5py==3.16.0",
    "harmonypy==0.0.10",
    "igraph>=1.0.0",
    "ipython==9.18.1",
    "jupytext==1.19.6",
    "leidenalg>=0.12.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pypdf>=7.0.0",
    "rich==15.0.0",
    "scanpy==1.11.5",
    "scikit-image>=0.26.0",
    "scikit-learn==1.9.1",
    "scipy>=1.15,<1.17",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
    "umap-learn==0.5.12",
]

[project.scripts]
opengo = "opengo.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
